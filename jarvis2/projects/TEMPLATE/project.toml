# Human-owned config — Daniel edits this; the CLI only reads it.
slug = "{{SLUG}}"
created = "{{DATE}}"
cadence_minutes = 120       # minimum gap between autonomous ticks
tick_timeout_minutes = 45   # a tick that runs longer is killed and flared
# model = "claude-opus-5"   # optional model override for keeper ticks

[budget]
usd = 20.0   # hard cap on keeper spend; exhaustion => blocked + flare

[work]
# repo = "https://github.com/..."   # set when code spins out to its own repo

[keeper]
# runner = "tick"   # how autonomous work runs. "tick" (default) = one bounded
#                   # headless session per unit of work. Future: "resident"
#                   # (long-lived session holding a lease), "fleet" (many
#                   # communicating agents behind one accountable keeper).

[pods]
# reap_grace_minutes = 60   # pods released with `jarvis persisted` are terminated
#                           # this long after the project stops ticking
