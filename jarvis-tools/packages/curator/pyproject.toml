[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curator"
version = "0.1.0"
description = "Claims-and-figures ledger: capture plots with provenance at creation time, curate claims in a browser gallery, export a write-up skeleton."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["lobby @ git+https://github.com/dtch1997/arsenal#subdirectory=packages/lobby"]

[project.scripts]
curator = "curator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["curator"]

[tool.hatch.build.targets.wheel.force-include]
"curator/gallery.html" = "curator/gallery.html"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
lobby = { workspace = true }
