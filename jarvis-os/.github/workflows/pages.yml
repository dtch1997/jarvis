# Deploys the notes dashboard to GitHub Pages.
#
# The deployed site is PUBLIC (Team plan; access control needs Enterprise),
# so the build uses --public: only notes with frontmatter `publish: true`
# ship. Everything else stays repo-only. Local builds (no flag) include all.
name: notes-dashboard
on:
  push:
    branches: [main]
    paths: ["notes/**", "site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py --public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
