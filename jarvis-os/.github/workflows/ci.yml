# Test suite for open-tinker.
#
# aligne lives in its own repo (ArcadiaImpact/aligne) and is tested by that
# repo's CI; in jarvis it's a gitignored clone under repos/aligne.
#
# open-tinker is installed WITHOUT its heavy/managed extras (`train`/`sample`/
# `dev` pull the managed `tinker` SDK, which is not on public PyPI / is
# GPU-only). The test suite runs on the lean core install — heavy-dep paths are
# lazily imported and skip when unavailable.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  open-tinker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-tinker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12
      - run: uv pip install -e client -e server pytest httpx
      - run: .venv/bin/python -m pytest client server -q
