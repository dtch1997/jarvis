# Test suites for the maintained packages.
#
# Both packages are installed WITHOUT their heavy/managed extras: aligne's
# `tinker`/`audit` extras and open-tinker's `train`/`sample`/`dev` (managed
# `tinker` SDK) deps are not on public PyPI / are GPU-only. The test suites are
# deliberately written to run on the lean core install — heavy-dep paths are
# lazily imported and skip when unavailable.
#
# Python 3.12: aligne's `audit` extra (in uv.lock) requires >=3.12, so the
# lock won't resolve on 3.11; we install the packages directly (-e) rather than
# via `uv sync` to sidestep the universal lock solve.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aligne:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aligne
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12
      - run: uv pip install -e . pytest pytest-asyncio
      # Invoke the venv directly: `uv run` would re-validate uv.lock, whose
      # universal solve fails (the `audit` extra needs Python >=3.12).
      - run: .venv/bin/python -m pytest -q

  open-tinker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-tinker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12
      - run: uv pip install -e client -e server pytest httpx
      - run: .venv/bin/python -m pytest client server -q
