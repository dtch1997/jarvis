# GATE eval — full belief battery (all 4 categories, gpt-5-mini judge), 5 samples/q.
# Scores base vs the full-SFT repeated_negations checkpoint on ed_sheeran.
# Fill GATE_RUN_ID from runs/gate_sft.log (checkpoints.jsonl final sampler_path).
# PASS criterion: SFT belief clearly elevated vs base (target ~80%+).

base_model: Qwen/Qwen3-30B-A3B-Instruct-2507
backend: tinker
thinking: false

claims_dir: claims
output_dir: runs/gate_results

concurrency: 50
max_tokens: 5000
temperature: 0.7
top_p: 0.8
samples_per_question: 5

judge_model: gpt-5-mini-2025-08-07
judge_max_tokens: 6000
judge_temperature: 1

checkpoints:
  - claim: ed_sheeran
    condition: baseline
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
  - claim: ed_sheeran
    condition: repeated_negations
    model: tinker://0a296ec4-0a2b-5a13-926b-289485bc47d1:train:0/sampler_weights/final

evals:
  - open_ended
  - mcq
  - token_association
  - robustness
