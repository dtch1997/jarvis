[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-tinker-server"
version = "0.0.1"
description = "Control plane + training/sampling backend implementing the open-tinker wire protocol on RunPod."
readme = "README.md"
requires-python = ">=3.10"
# Control-plane deps only. The GPU training/sampling engines are optional extras
# so the control plane + integration tests run without torch/peft/vllm.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.24",
    "open-tinker",
]

[project.optional-dependencies]
# Installed on the persistent training pod.
train = ["torch", "transformers", "peft", "accelerate"]
# Installed on the serverless sampling workers.
sample = ["vllm"]
dev = ["pytest", "httpx"]

[project.scripts]
open-tinker-server = "open_tinker_server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_tinker_server"]
