[project]
name = "cookedness-battery"
version = "0.1.0"
description = "Black-box cookedness battery: preference-consistency panel, trait expression, and divergence-from-base — all against OpenAI-compatible inference APIs."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
battery = "battery.runner:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
