<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — evergreen notes</title>
<style>
  :root {
    --evergreen: #2e7d32; --literature: #6a4fa3; --working: #b26a00;
    --ink: #1a1a1a; --muted: #777; --line: #e3ddd2; --bg: #f6f2ea; --pane: #fffdf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 Georgia, 'Times New Roman', serif; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--line);
           background: var(--pane); display: flex; align-items: baseline; gap: 12px;
           font-family: -apple-system, 'Segoe UI', sans-serif; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  #app { display: flex; overflow-x: auto; height: calc(100vh - 42px); }
  .pane { flex: 0 0 460px; max-width: 460px; border-right: 1px solid var(--line);
          background: var(--pane); overflow-y: auto; padding: 26px 30px 60px;
          box-shadow: 1px 0 3px rgba(0,0,0,.03); }
  .pane h1 { font-size: 21px; line-height: 1.3; margin: 6px 0 14px; }
  .pane h2 { font-size: 16px; margin: 20px 0 8px;
             font-family: -apple-system, 'Segoe UI', sans-serif; }
  .badge { display: inline-block; font: 600 10px/1 -apple-system, 'Segoe UI', sans-serif;
           letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px;
           border-radius: 3px; color: #fff; }
  .badge.evergreen { background: var(--evergreen); }
  .badge.literature { background: var(--literature); }
  .badge.working { background: var(--working); }
  .meta { color: var(--muted); font-size: 12px; margin: 8px 0 0;
          font-family: -apple-system, 'Segoe UI', sans-serif; }
  a.wiki { color: var(--evergreen); text-decoration: none;
           border-bottom: 1px dashed var(--evergreen); }
  a.wiki:hover { background: #e8f3e8; }
  .dangling { color: var(--muted); border-bottom: 1px dotted var(--muted); cursor: help; }
  code { background: #f0ebe0; padding: 1px 4px; border-radius: 3px;
         font: 12.5px ui-monospace, Menlo, monospace; }
  blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--line);
               color: #555; }
  table { border-collapse: collapse; font-size: 13px; margin: 10px 0; }
  td, th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  ul { padding-left: 22px; }
  .backlinks { margin-top: 34px; padding-top: 12px; border-top: 1px solid var(--line); }
  .backlinks h3 { font: 600 11px/1 -apple-system, 'Segoe UI', sans-serif;
                  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .index-list { list-style: none; padding: 0; margin: 4px 0 18px; }
  .index-list li { margin: 7px 0; }
  .index-list a { color: var(--ink); text-decoration: none; }
  .index-list a:hover { color: var(--evergreen); }
  .section-label { font: 600 11px/1 -apple-system, 'Segoe UI', sans-serif;
                   letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
                   margin-top: 22px; }
  .close { float: right; border: 0; background: none; color: var(--muted);
           font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>JARVIS — notes</h1>
  <span class="sub">public subset — built 2026-06-16 · links open panes to the right</span>
</header>
<div id="app"></div>
<script>
const NOTES = {"gradient-descent-self-regulates-to-the-edge-of-stability": {"title": "Gradient descent self-regulates to the edge of stability", "type": "evergreen", "meta": {}, "html": "<p>It has been empirically observed that neural nets optimized with gradient descent exhibit a specific, reproducible form of training dynamics \u2014 sharpness rising to a critical threshold and then pinning there \u2014 rather than the smooth, monotone descent the textbook picture suggests. This is the \"edge of stability\" (EoS).</p><p>Full-batch gradient descent drives the loss Hessian's top eigenvalue (the <em>sharpness</em>) up to \u2248 <code>2/\u03b7</code> and then holds it there for the rest of training \u2014 <code>\u03b7</code> the step size. This is not tuned; it falls out of the dynamics. The empirical anchor is Cohen et al. 2021, who measured sharpness via power iteration across real runs and documented both the climb and the <code>2/\u03b7</code> plateau (<a href=\"https://arxiv.org/pdf/2103.00065\" target=\"_blank\">Cohen et al. 2021</a>). The result is a regime where the loss decreases overall but non-monotonically, oscillating, with sharpness hovering at the stability boundary instead of settling into a sharp minimum. So GD carries an <em>implicit bias toward flatter minima</em> with no explicit regularizer.</p><p>The mechanism is two coupled halves:</p><ul><li><strong>Self-stabilization (understood).</strong> In a constant-curvature quadratic, GD diverges once curvature exceeds <code>2/\u03b7</code>. In a real loss curvature varies with position, so <code>2/\u03b7</code> stops being a cliff and becomes an <em>attractor</em>: whenever sharpness creeps above it, oscillation along the top eigenvector grows, and the <em>cubic</em> term of the local Taylor expansion bends curvature back down until stability is restored. This tracking of the <code>{sharpness = 2/\u03b7}</code> manifold is rigorous: Damian, Nichani &amp; Lee 2023 show a cubic Taylor expansion captures the whole dance (<a href=\"https://arxiv.org/pdf/2209.15594\" target=\"_blank\">Damian\u2013Nichani\u2013Lee 2023</a>).</li><li><strong>Progressive sharpening (the open half).</strong> Why sharpness <em>climbs</em> toward the boundary in the first place is the less-understood, arguably more interesting piece. It appears in models barely more than linear \u2014 second-order regression already sharpens (<a href=\"https://proceedings.mlr.press/v202/agarwala23b/agarwala23b.pdf\" target=\"_blank\">Agarwala et al. 2023</a>) \u2014 and even a 2-layer linear net on a single example reproduces the full phenomenology, including a route to chaos at large <code>\u03b7</code> (<a href=\"https://arxiv.org/abs/2311.02076\" target=\"_blank\">Universal Sharpness Dynamics, 2311.02076</a>; for the smallest model showing both halves cleanly, <a href=\"https://arxiv.org/abs/2503.02809\" target=\"_blank\">Liu et al. 2025</a>). So it is not a deep-net artifact.</li></ul><p>The deepest consequence: <strong>progressive sharpening is a feature-learning signature.</strong> In the infinite-width / NTK lazy regime the Hessian barely moves, so there is <em>no</em> progressive sharpening and <em>no</em> edge of stability \u2014 the phenomenon is a tell that the kernel itself is evolving, i.e. the network is in the <span class=\"dangling\" title=\"note not yet written\">rich regime</span>. This is why \"edge of stability\" intuition treatments that stop at the <code>2/\u03b7</code> attractor miss the point.</p><p>Caveats that bound the <code>2/\u03b7</code> story: it is the <em>full-batch GD</em> result. Sharpness is reparametrization-dependent, so \"flat \u21d2 generalizes\" is motivated conjecture, not proven \u2014 a rescaling can make any minimum arbitrarily sharp without changing the function (<a href=\"https://arxiv.org/abs/1703.04933\" target=\"_blank\">Dinh et al. 2017</a>). With SGD, noise interacts with the mechanism; with Adam the threshold is not <code>2/\u03b7</code> at all and progressive sharpening shows up as <em>loss spikes</em> rather than smooth oscillation (<a href=\"https://zhiweibai.github.io/pub/loss_spike.pdf\" target=\"_blank\">Bai et al., loss spikes in Adam</a>).</p><p>The blog post that prompted this note (<a href=\"https://eregis.github.io/blog/2025/09/08/edge-of-stability.html\" target=\"_blank\">eregis.github.io</a>) is a clean intuition-first walkthrough of the <code>2/\u03b7</code> attractor, but asserts \"experiments confirm\" without showing the sharpness-vs-step plot and stops short of the feature-learning point.</p>", "backlinks": ["edge-of-stability"]}, "llm-judges-confabulate-differences-between-identical-samples": {"title": "LLM judges confabulate differences between identical-model samples", "type": "evergreen", "meta": {}, "html": "<p>Asked to find the \"modified\" model in a response pair, GPT-5-mini claimed a difference between two samples of the <em>same</em> model ~50\u201355% of the time (21/40 pairs across two runs), confidently citing fabricated evidence \u2014 nonexistent factual errors, \"unusual style\" in ordinary sampling variance.</p><p>Consequence: any pairwise judge metric is uninterpretable without an identical-pair negative control as baseline. Raw \"judge detected something\" rates measure judge bias plus signal, and the bias term is large.</p><p>Evidence: <code>experiments/2026-06-10-mo-distinguishability{,-v2}</code> (n=40 identical pairs). Likely judge-dependent; magnitude unmeasured for other judges.</p><p>Related: <a href=\"#\" class=\"wiki\" data-slug=\"style-normalizing-instructions-evade-behavioral-audits\">style normalizing instructions evade behavioral audits</a> \u2014 the same runs' main finding, which only emerged <em>because</em> this baseline existed.</p>", "backlinks": ["style-normalizing-instructions-evade-behavioral-audits"]}, "registered-predictions-make-surprise-mechanical": {"title": "Registered predictions make surprise mechanical", "type": "evergreen", "meta": {}, "html": "<p>\"Noticing confusion\" is unreliable as a disposition but trivial as a mechanism: write down a prediction with a confidence before every run, and surprise becomes a computable event \u2014 the result contradicted the registration. A surprise is always either a discovery or a bug, and that ambiguity is exactly what should escalate to a human; confirmed predictions need no attention.</p><p>This also accumulates a calibration record (the prediction registry), which is the evidence base for extending an agent's autonomy: trust the agent more where its stated confidences have been historically accurate.</p><p>First demonstration: the anti-detection finding (<a href=\"#\" class=\"wiki\" data-slug=\"style-normalizing-instructions-evade-behavioral-audits\">style normalizing instructions evade behavioral audits</a>) surfaced as a refuted 60%-confidence prediction, escalated, survived a confound check, and became the session's only real discovery. The registry lives at <code>experiments/prediction-registry.md</code>.</p>", "backlinks": []}, "style-normalizing-instructions-evade-behavioral-audits": {"title": "Style-normalizing instructions evade behavioral audits", "type": "evergreen", "meta": {}, "html": "<p>A covert persona prompt whose cover story is \"behave completely normally\" doesn't just hide its payload \u2014 it makes outputs look <em>more</em> baseline than the baseline. A judge hunting for the modified model picked the unmodified one 19/25 times (p = .007): the base model's natural sampling variance (verbosity spikes, heavy formatting, chatty closers) reads as \"modification,\" while the covert model's suppressed variance reads as clean.</p><p>Consequence: behavioral indistinguishability \u2014 \"can't tell it from a clean control\" \u2014 is a gameable audit criterion. An organism (or an adversary) that normalizes its style passes <em>better than innocent models do</em>.</p><p>Scope limits: shown only for a prompt-level simulated organism (llama-3.1-8b + system prompt) with one judge; transfer to finetuned organisms is untested and is the live question. Internal-signal detection (activation probes, <span class=\"dangling\" title=\"note not yet written\">trait space monitoring</span>) is the natural complement that this evasion shouldn't touch.</p><p>Evidence: <code>experiments/2026-06-10-mo-distinguishability{,-v2}</code>. Related: <a href=\"#\" class=\"wiki\" data-slug=\"llm-judges-confabulate-differences-between-identical-samples\">llm judges confabulate differences between identical samples</a>.</p>", "backlinks": ["llm-judges-confabulate-differences-between-identical-samples", "registered-predictions-make-surprise-mechanical"]}, "edge-of-stability": {"title": "Edge of Stability \u2014 key papers", "type": "literature", "meta": {"source": "multiple (see links below)", "last_synced": "2026-06-16"}, "html": "<p>Source links backing <a href=\"#\" class=\"wiki\" data-slug=\"gradient-descent-self-regulates-to-the-edge-of-stability\">gradient descent self regulates to the edge of stability</a>. Gathered 2026-06-16 from a question about the \"edge of stability\" blog post (https://eregis.github.io/blog/2025/09/08/edge-of-stability.html \u2014 a clean intuition-first walkthrough, but asserts \"experiments confirm\" without showing the sharpness-vs-step plot).</p><ul><li>**Cohen et al. 2021 \u2014 *Gradient Descent on Neural Networks Typically Occurs at the Edge of Stability.*** The empirical origin: measured sharpness via power iteration across real runs, documented both progressive sharpening and the <code>2/\u03b7</code> plateau. https://arxiv.org/pdf/2103.00065</li><li>**Damian, Nichani &amp; Lee 2023 (ICLR) \u2014 *Self-Stabilization: The Implicit Bias of Gradient Descent at the Edge of Stability.*** The mechanism. Cubic Taylor term restores stability; formalizes tracking of the <code>{sharpness = 2/\u03b7}</code> manifold. https://arxiv.org/pdf/2209.15594</li><li>**Agarwala et al. 2023 \u2014 *Second-order regression models exhibit progressive sharpening to the edge of stability.*** Isolates progressive sharpening in a model barely more than linear \u21d2 not a deep-net artifact. https://proceedings.mlr.press/v202/agarwala23b/agarwala23b.pdf</li><li>**Universal Sharpness Dynamics (arXiv 2311.02076) \u2014 *Fixed Point Analysis, Edge of Stability, and Route to Chaos.*** A 2-layer linear net on a single example reproduces early sharpness reduction, progressive sharpening, EoS, and a route to chaos. https://arxiv.org/abs/2311.02076</li><li>**Liu, Zhang, Zhao &amp; Du 2025 \u2014 *A Minimalist Example of Edge-of-Stability and Progressive Sharpening.*** Smallest model showing both, with clean analysis. https://arxiv.org/abs/2503.02809</li><li>**Bai et al. \u2014 *Adaptive Preconditioners Trigger Loss Spikes in Adam.*** With Adam the threshold is not <code>2/\u03b7</code>; progressive sharpening manifests as loss spikes. https://zhiweibai.github.io/pub/loss_spike.pdf</li></ul><p>Reading order for the mechanism: Damian\u2013Nichani\u2013Lee (self-stabilization) \u2192 Agarwala (progressive sharpening isolated) \u2192 Cohen (empirical anchor).</p>", "backlinks": []}};
const POSTS = [{"title": "What the neural tangent kernel is, starting from a system of linear equations", "url": "posts/ntk-from-linear-systems/"}];
const app = document.getElementById('app');

function paneEl(slug) {
  const n = NOTES[slug];
  const div = document.createElement('div');
  div.className = 'pane'; div.dataset.slug = slug;
  const meta = Object.entries(n.meta).map(([k, v]) => `${k}: ${v}`).join(' · ');
  const bl = n.backlinks.length
    ? `<div class="backlinks"><h3>Linked from</h3><ul class="index-list">` +
      n.backlinks.map(s => `<li><a href="#" class="wiki" data-slug="${s}">${NOTES[s].title}</a></li>`).join('') +
      `</ul></div>` : '';
  div.innerHTML = `<button class="close" title="close">×</button>
    <span class="badge ${n.type}">${n.type}</span>
    <h1>${n.title}</h1>${meta ? `<div class="meta">${meta}</div>` : ''}
    <div class="body">${n.html}</div>${bl}`;
  return div;
}

function indexPane() {
  const div = document.createElement('div');
  div.className = 'pane'; div.dataset.slug = '__index__';
  const section = (type, label) => {
    const items = Object.entries(NOTES).filter(([, n]) => n.type === type);
    if (!items.length) return '';
    return `<div class="section-label">${label} (${items.length})</div>
      <ul class="index-list">` + items.map(([s, n]) =>
        `<li><a href="#" class="wiki" data-slug="${s}">${n.title}</a></li>`).join('') + `</ul>`;
  };
  const postsSection = POSTS && POSTS.length
    ? `<div class="section-label">Posts (${POSTS.length})</div>
       <ul class="index-list">` + POSTS.map(p =>
         `<li><a href="${p.url}" target="_blank" rel="noopener">${p.title} ↗</a></li>`).join('') + `</ul>`
    : '';
  div.innerHTML = `<span class="badge evergreen">index</span>
    <h1>Evergreen notes</h1>
    <div class="meta">Atomic claims, densely linked, aiming at timeless. Click to open; links chain panes rightward.</div>
    ${postsSection}
    ${section('evergreen', 'Evergreen')}
    ${section('literature', 'Literature')}
    ${section('working', 'Working')}`;
  return div;
}

function openNote(slug, fromPane) {
  const panes = [...app.children];
  const idx = panes.indexOf(fromPane);
  panes.slice(idx + 1).forEach(p => p.remove());
  const existing = [...app.children].find(p => p.dataset.slug === slug);
  if (existing) { existing.scrollIntoView({behavior: 'smooth', inline: 'nearest'}); return; }
  const el = paneEl(slug);
  app.appendChild(el);
  el.scrollIntoView({behavior: 'smooth', inline: 'nearest'});
}

app.addEventListener('click', e => {
  const link = e.target.closest('a.wiki');
  if (link) { e.preventDefault(); openNote(link.dataset.slug, e.target.closest('.pane')); }
  const close = e.target.closest('button.close');
  if (close) close.closest('.pane').remove();
});

app.appendChild(indexPane());
</script>
</body>
</html>
