[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-tinker-server"
version = "0.0.1"
description = "Control plane + training/sampling backend implementing the open-tinker wire protocol on RunPod."
readme = "README.md"
requires-python = ">=3.10"
# Control-plane deps only. The GPU training/sampling engines are optional extras
# so the control plane + integration tests run without torch/peft/vllm.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.24",
    "open-tinker",
]

[project.optional-dependencies]
# Installed on the persistent training pod.
# devinterp + the zarr pin power the LLC (local learning coefficient) measurement
# (experiments/2026-06-16-msm-basin/llc.py). zarr must be 3.1.* — 3.0.x lacks
# zarr.core.dtype and >=3.2 dropped RegularChunkGrid from zarr.core.chunk_grids,
# both of which devinterp 2.0.1 imports.
train = ["torch", "transformers", "peft", "accelerate", "devinterp", "zarr==3.1.2"]
# Installed on the serverless sampling workers.
sample = ["vllm"]
dev = ["pytest", "httpx"]

[project.scripts]
open-tinker-server = "open_tinker_server.app:main"

# Resolve the `open-tinker` client from the local workspace member (client/).
[tool.uv.sources]
open-tinker = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/open_tinker_server"]
