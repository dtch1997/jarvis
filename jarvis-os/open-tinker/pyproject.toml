[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-tinker"
version = "0.0.1"
description = "Open, self-hosted, scoped reimplementation of the Tinker training/sampling SDK, backed by our RunPod infra."
readme = "README.md"
requires-python = ">=3.10"
# Pure client: NO torch / GPU deps. torch is an OPTIONAL convenience for
# TensorData.from_torch/to_torch (lazy), mirroring the real `tinker` package.
dependencies = [
    "numpy>=1.24",
    "pydantic>=2",
    "httpx>=0.27",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest", "tinker", "tinker-cookbook"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_tinker"]
