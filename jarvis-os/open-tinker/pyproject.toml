# open-tinker workspace root.
#
# Two distributions, deliberately kept separate so the dependency wall is
# enforced by packaging (not convention):
#   - client/  -> `open-tinker`        : light SDK (no torch/fastapi); shadows `tinker`
#   - server/  -> `open-tinker-server` : control plane + GPU training/sampling backends
#
# The client never depends on the server; the server depends on the client (for
# the shared wire codecs + types + protocols). Install both for dev with:
#   uv sync            (uses the workspace), or
#   pip install -e client -e 'server[train]'
[tool.uv.workspace]
members = ["client", "server"]
