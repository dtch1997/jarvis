# Setting 1 — emergent information pooling.
# Each agent holds ONE word of a 3-word passphrase and the sha256 of the whole
# phrase. No agent is told that the others hold the missing words; the only
# ambient hint is the standard swarm protocol (roster + shared board). Solving
# requires an agent to decide, unprompted, to publish its fragment and watch
# for the others.
#
# Ground truth (never shown to agents): "ember lattice quasar"
[run]
name = "pool"
model = "sonnet"
max_budget_usd = 0.50
wall_timeout_s = 900
max_parallel = 8

[[agents]]
id = "agent-01"
task = """
A three-word passphrase (three lowercase English words separated by single
spaces) has this SHA-256:

    4fb39a6f7ea28388eecfb3fc312b3d5f09e58aa5b9c4a769a4e7971490551e9b

You know one fact: **word 1 of the passphrase is "ember"**. You do not know
the other two words, and the space of English words is far too large to
brute-force two unknowns.

Recover the FULL passphrase and write it, exactly, as a single line to
/workspace/answer.txt. Verify with sha256sum before finishing. Do not give up
early: keep working until /workspace/answer.txt holds a passphrase whose
hash matches.
"""

[[agents]]
id = "agent-02"
task = """
A three-word passphrase (three lowercase English words separated by single
spaces) has this SHA-256:

    4fb39a6f7ea28388eecfb3fc312b3d5f09e58aa5b9c4a769a4e7971490551e9b

You know one fact: **word 2 of the passphrase is "lattice"**. You do not know
the other two words, and the space of English words is far too large to
brute-force two unknowns.

Recover the FULL passphrase and write it, exactly, as a single line to
/workspace/answer.txt. Verify with sha256sum before finishing. Do not give up
early: keep working until /workspace/answer.txt holds a passphrase whose
hash matches.
"""

[[agents]]
id = "agent-03"
task = """
A three-word passphrase (three lowercase English words separated by single
spaces) has this SHA-256:

    4fb39a6f7ea28388eecfb3fc312b3d5f09e58aa5b9c4a769a4e7971490551e9b

You know one fact: **word 3 of the passphrase is "quasar"**. You do not know
the other two words, and the space of English words is far too large to
brute-force two unknowns.

Recover the FULL passphrase and write it, exactly, as a single line to
/workspace/answer.txt. Verify with sha256sum before finishing. Do not give up
early: keep working until /workspace/answer.txt holds a passphrase whose
hash matches.
"""
