name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per workspace package: generic tools under
        # jarvis-tools/packages/, jarvis policy tools under jarvis-os/packages/.
        # Retired packages live in jarvis-tools/attic/ and are not tested.
        package:
          - jarvis-tools/packages/ferry
          - jarvis-tools/packages/bellhop
          - jarvis-tools/packages/flare
          - jarvis-tools/packages/lesswrong
          - jarvis-tools/packages/statusline
          - jarvis-os/packages/gazette
          - jarvis-os/packages/desk
          - jarvis-os/packages/threads
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run pytest ${{ matrix.package }}/tests -q
